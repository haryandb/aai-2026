<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <a href="/" class="btn btn-outline-secondary mb-4">&larr; Back to Products</a>
        
        <div class="row">
            <div class="col-md-5">
                <img src="{{ product.image_url }}" class="img-fluid rounded shadow" alt="{{ product.description }}">
            </div>
            <div class="col-md-7">
                <h4 class="text-muted">Stock Code: {{ product.stock_code }}</h4>
                <h2 class="mb-3">{{ product.description }}</h2>
                <h3 class="text-primary mb-4">${{ "%.2f"|format(product.unit_price) }}</h3>
                <button class="btn btn-primary btn-lg">Add to Cart</button>
            </div>
        </div>

        <hr class="my-5">

        <h4 class="mb-4">Recommendations For You</h4>
        <div class="row">
            {% for rec in product.recommendations %}
            <div class="col-6 col-md-4 col-lg-3 col-xl-2 mb-4">
                <a href="/products/{{ rec.stock_code }}" class="text-decoration-none">
                    <div class="card h-100">
                        <img src="{{ rec.image_url }}" class="card-img-top" alt="{{ rec.description }}">
                        <div class="card-body p-2">
                            <p class="card-text small text-truncate">{{ rec.description }}</p>
                            <p class="card-text fw-bold text-primary">${{ "%.2f"|format(rec.unit_price) }}</p>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
