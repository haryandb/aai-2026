<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Monolithic Starter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5" x-data="usersData()">
        <h1 class="mb-4">Users</h1>
        
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>User List</span>
                        <button class="btn btn-primary btn-sm" @click="fetchUsers()">Refresh</button>
                    </div>
                    <div class="card-body">
                        <div x-show="loading" class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div x-show="!loading && users.length === 0" class="text-center text-muted">
                            No users found.
                        </div>
                        <table x-show="!loading && users.length > 0" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="user in users" :key="user.id">
                                    <tr>
                                        <td x-text="user.id"></td>
                                        <td x-text="user.username"></td>
                                        <td x-text="user.email"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        function usersData() {
            return {
                users: [],
                loading: true,
                error: null,
                async fetchUsers() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const response = await fetch('/api/users');
                        if (!response.ok) throw new Error('Failed to fetch users');
                        this.users = await response.json();
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },
                init() {
                    this.fetchUsers();
                }
            }
        }
    </script>
</body>
</html>
