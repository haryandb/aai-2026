[tool.poetry]
name = "flask-monolithic-starter"
version = "0.1.0"
description = "A Flask monolithic web application starter kit"
authors = ["Developer <developer@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.0"
flask-sqlalchemy = "^3.1.1"
flask-migrate = "^4.0.5"
python-dotenv = "^1.0.0"
tqdm = "^4.67.3"
pandas = "^2.2.0"

[tool.poetry.group.dev.dependencies]
faker = "^22.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"